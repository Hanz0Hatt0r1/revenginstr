name: Apply roadmap M8-M13 extension

on:
  push:
    paths:
      - '.github/workflows/roadmap-extension-once.yml'

permissions:
  contents: write

jobs:
  update-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extend ROADMAP through M13
        shell: bash
        run: |
          python scripts/update_roadmap_m8_m13_once.py
          git diff --check
          git diff -- docs/ROADMAP.md
          git config user.name 'revenginstr-roadmap-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ROADMAP.md
          git commit -m 'docs: extend roadmap through M13'
          git push origin HEAD:main
