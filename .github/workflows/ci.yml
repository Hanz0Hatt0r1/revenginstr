name: revenginstr CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Test
        run: pytest -q
      - name: Validate shell syntax
        run: bash -n scripts/run_ghidra_pcode_export.sh
      - name: Validate generic exporter contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('ghidra/PortablePcodeCorpusExporter.java').read_text()
          assert 'REVENGINSTR.PcodeCorpus/1' in text
          assert 'MAX_MODEL_OPS = 256' in text
          assert 'Nevergone' not in text
          assert 'SHIFT' not in text
          print('generic exporter contract: OK')
          PY
