name: revenginstr CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[test,ml]'
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Test
        run: pytest -q
      - name: Validate shell syntax
        run: |
          bash -n scripts/run_ghidra_pcode_export.sh
          bash -n scripts/run_ghidra_receiver_types.sh
          bash -n scripts/run_ghidra_vtable_slots.sh
          bash -n scripts/run_ghidra_function_pcode_flow.sh
          bash -n scripts/run_ghidra_caller_argument_subtree.sh
          bash -n scripts/run_ghidra_function_identities.sh
          bash -n scripts/run_ghidra_pcode_defined_strings.sh
          bash -n scripts/run_ghidra_address_reference_owners.sh
          bash -n scripts/run_ghidra_function_operands.sh
          bash -n scripts/run_ghidra_address_metadata.sh
      - name: Validate generic exporter contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('ghidra/PortablePcodeCorpusExporter.java').read_text()
          assert 'REVENGINSTR.PcodeCorpus/1' in text
          assert 'MAX_MODEL_OPS = 256' in text
          assert 'Nevergone' not in text
          assert 'SHIFT' not in text
          print('generic exporter contract: OK')
          PY
      - name: Validate function P-code flow boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('ghidra/ExportFunctionPcodeFlow.java').read_text()
          assert 'function_entry\\top_address\\top_time\\topcode\\toutput\\tinputs\\tcallee_entry\\tcallee_name' in text
          for forbidden in ('Nevergone', 'GameScene', 'HDVehicle', 'SHIFT'):
              assert forbidden not in text
          print('function P-code flow contract: OK')
          PY
      - name: Validate selective classifier boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/revenginstr/ml/selective.py').read_text()
          assert 'REVENGINSTR.SelectiveClassifier/1' not in text or 'SELECTIVE_CLASSIFIER_FORMAT' in text
          for forbidden in ('GameScene', 'HDVehicle', 'manager+0x374'):
              assert forbidden not in text
          print('selective classifier boundary: OK')
          PY
