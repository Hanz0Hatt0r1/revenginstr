[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revenginstr"
version = "0.5.2"
description = "Reusable reverse-engineering analysis tooling"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Hanz0Hatt0r1"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
ml = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.5",
  "joblib>=1.3",
]
benchmark = ["jsonschema>=4"]
test = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
revenginstr-benchmark = "revenginstr.benchmark:main"
revenginstr-determinism-audit = "revenginstr.benchmark_determinism:main"
revenginstr-benchmark-delta = "revenginstr.benchmark_delta:main"
revenginstr-kpi-dashboard = "revenginstr.kpi_dashboard:main"
revenginstr-pcode-audit = "revenginstr.pcode.audit:main"
revenginstr-pcode-instruction-coverage = "revenginstr.pcode.coverage:main"
revenginstr-pcode-userop-coverage = "revenginstr.pcode.userop_coverage:main"
revenginstr-pcode-address-space-coverage = "revenginstr.pcode.address_space_coverage:main"
revenginstr-pcode-c-function = "revenginstr.pcode.c_lowering:main"
revenginstr-pcode-c-lowering-coverage = "revenginstr.pcode.c_lowering_coverage:main"
revenginstr-pcode-c-lowering-corpus = "revenginstr.pcode.c_lowering_corpus:main"
revenginstr-foreign-guard = "revenginstr.ood.foreign_guard:main"
revenginstr-callgraph = "revenginstr.evidence.callgraph:main"
revenginstr-callind-inventory = "revenginstr.callind_inventory:main"
revenginstr-pointer-provenance = "revenginstr.pointer_provenance:main"
revenginstr-indirect-call-pointer-slots = "revenginstr.indirect_call_slots:main"
revenginstr-type-layout-hypothesis = "revenginstr.type_layout_builder:main"
revenginstr-type-layout-evaluate = "revenginstr.type_layout_evaluation:main"
revenginstr-function-prototype-evaluate = "revenginstr.prototype_evaluation:main"
revenginstr-direct-call-arguments = "revenginstr.prototype_callsite_observations:main"
revenginstr-prototype-callsite-check = "revenginstr.prototype_callsite_compatibility:main"
revenginstr-prototype-infer = "revenginstr.prototype_inference:main"
revenginstr-evidence-aggregate = "revenginstr.evidence.aggregate:main"
revenginstr-receiver-plan = "revenginstr.receiver.plan:main"
revenginstr-receiver-infer = "revenginstr.receiver.infer:main"
revenginstr-receiver-graph = "revenginstr.receiver.provenance:main"
revenginstr-receiver-argument-flow = "revenginstr.receiver.provenance:caller_argument_main"
revenginstr-receiver-store-flow = "revenginstr.receiver.provenance:parameter_store_main"
revenginstr-receiver-argument-store-flow = "revenginstr.receiver.provenance:argument_store_main"
revenginstr-receiver-argument-load-flow = "revenginstr.receiver.provenance:argument_load_main"
revenginstr-receiver-field-access-pairs = "revenginstr.receiver.provenance:field_access_pairs_main"
revenginstr-receiver-load-return-flow = "revenginstr.receiver.provenance:parameter_load_return_main"
revenginstr-receiver-argument-propagate = "revenginstr.receiver.provenance:recursive_argument_main"
revenginstr-receiver-call-return-flow = "revenginstr.receiver.provenance:call_return_main"
revenginstr-direct-call-memory-effects = "revenginstr.receiver.call_effects:main"
revenginstr-direct-call-memory-effect-closure = "revenginstr.receiver.call_effect_closure:main"
revenginstr-interprocedural-memory-effects = "revenginstr.receiver.interprocedural_memory:main"
revenginstr-receiver-field-store-load-audit = "revenginstr.receiver.field_flow:main"
revenginstr-receiver-field-store-load-dominance-audit = "revenginstr.receiver.field_flow:dominance_main"
revenginstr-family-mine = "revenginstr.family.mine:main"
revenginstr-selective-train = "revenginstr.ml.selective:train_main"
