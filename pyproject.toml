revenginstr-semantic-program-graph-evaluate = "revenginstr.semantic_program_graph_evaluation:main"
revenginstr-semantic-role-evaluate = "revenginstr.semantic_roles:main"
revenginstr-decision-ledger-audit = "revenginstr.decision_ledger:main"
revenginstr-analysis-invalidation-plan = "revenginstr.analysis_task_graph:main"
revenginstr-analysis-task-cache-keys = "revenginstr.analysis_task_cache:main"
