revenginstr-state-machine-candidates = "revenginstr.state_machine:main"
revenginstr-object-role-clusters = "revenginstr.object_roles:main"
revenginstr-object-role-features = "revenginstr.object_role_features:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/revenginstr/schemas" = ["schemas/*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
